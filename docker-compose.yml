services:
  api:
    build:
      context: .
    env_file: .env
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql+pymysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DATABASE: ${DB_DATABASE:-}
      DB_ECHO: ${DB_ECHO:-false}
      DB_SSL: ${DB_SSL:-false}
      DB_RUN_MIGRATIONS: ${DB_RUN_MIGRATIONS:-false}
      DB_MIGRATIONS_PATH: ${DB_MIGRATIONS_PATH:-/app/db/migrations}
      SERVICE_HOST: ${SERVICE_HOST:-0.0.0.0}
      SERVICE_PORT: ${SERVICE_PORT:-}
      DB_USE_LOCK: ${DB_USE_LOCK:-true}
      API_URL_PREFIX: ${API_URL_PREFIX:-}
      API_TAGS: ${API_TAGS:-}
      APPLICATION_AUTH_DISABLED: ${APPLICATION_AUTH_DISABLED:-false}
      APPLICATION_AUTHORITY: ${APPLICATION_AUTHORITY:-}
      APPLICATION_TENANT_ID: ${APPLICATION_TENANT_ID:-}
      APPLICATION_CLIENT_ID: ${APPLICATION_CLIENT_ID:-}
      APPLICATION_API_AUDIENCE: ${APPLICATION_API_AUDIENCE:-}
      APPLICATION_API_SCOPE: ${APPLICATION_API_SCOPE:-}
      AZURE_LANGUAGE_ENDPOINT: ${AZURE_LANGUAGE_ENDPOINT:-}
      APPLICATION_PII_DISABLED: ${APPLICATION_PII_DISABLED:-false}
    ports:
      - "127.0.0.1:${SERVICE_PORT}:${SERVICE_PORT}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mariadb_data: